<body>
<header><h1>南勢國中 115-1 教師調課與代課查詢</h1>
<div class="sub">完整版｜安全調課判斷＋空堂代課＋場地容量檢查</div></header>
<main>
<section class="panel">
 <div class="tabs">
  <button id="tabSwap" class="tab active" onclick="switchTab('swap')">教師調課</button>
  <button id="tabFree" class="tab" onclick="switchTab('free')">誰是空堂可代課</button>
 </div>

 <div id="swapView">
  <div class="controls"><input id="surname" placeholder="輸入姓氏，例如：陳" oninput="filterTeachers()" autocomplete="off">
  <button onclick="surname.value='';filterTeachers()">清除</button></div>
  <div id="chips" class="chips" style="margin-top:12px"></div>
 </div>

 <div id="freeView" class="hidden">
  <div class="controls">
   <label>星期 <select id="freeDay"><option value="1">一</option><option value="2">二</option><option value="3">三</option><option value="4">四</option><option value="5">五</option></select></label>
   <label>節次 <select id="freePeriod"><option value="1">第1節</option><option value="2">第2節</option><option value="3">第3節</option><option value="4">第4節</option><option value="5">第5節</option><option value="6">第6節</option><option value="7">第7節</option><option value="8">第8節</option></select></label>
   <button class="primary" onclick="showFree()">查詢空堂老師</button>
  </div>
  <div id="freeResult"></div>
 </div>
</section>

<section id="teacherPanel" class="panel">
 <h2 id="who">請先輸入姓氏並選擇老師</h2>
 <div id="teacherTable"></div>
 <div class="warn"><b>安全規則：</b>第 8 節不參與調課；單雙週、協同教師、同班同節多筆課務、教師同節跨班等需要連動的複雜課務，直接標示為不可調，不會出現在候選結果。<br><b>提醒：</b>若該教師為兼課教師，課程可能無法調課。</div>
</section>

<section id="swapPanel" class="panel hidden">
 <h2 id="swapTitle">可調課結果</h2>
 <div id="map"></div>
 <div id="results"></div>
</section>
</main>

const TEACHERS=["劉宇恆", "劉怡君", "劉珉秀", "劉育誠", "吳俐穎", "吳國源", "吳懿珊", "康羽玟", "廖志偉", "張怡", "張毓蘋", "張芷榆", "張華方", "徐鳳鳴", "曹于婷", "曾冠堯", "曾翠珊", "李平生", "李紫毓", "李藺璽", "李雅竹", "林安娜", "林彥同", "林怡均", "林美銀", "林育姍", "楊勝傑", "楊翔閔", "楊若婕", "江雅萍", "温晴芳", "游育嫻", "王姿懿", "王昱文", "王曉玲", "翁子涵", "胡俊男", "蔡晏寧", "蔡梓暄", "蔡秀偉", "蔡萊拉", "藍雅馨", "褚婉伶", "許恩愷", "詹淨伃", "謝妙鐶", "謝筱梅", "賴穎姿", "趙宏邦", "趙興融", "鄭金枝", "闕伯穎", "陳依苓", "陳俞安", "陳冠寧", "陳又慈", "陳孟凱", "陳思元", "陳秀華", "陳雅雯", "陳韻羽", "魏吟芳", "黃永志"];
const CONTROLLED={"體育": 3, "音樂": 2, "生活科技": 2, "表演藝術": 2, "視覺藝術": 2, "資訊科技": 2, "家政": 2};
const DAYN=['一','二','三','四','五'];
let current='', origin=null;

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function switchTab(tab){
 document.getElementById('swapView').classList.toggle('hidden',tab!=='swap');
 document.getElementById('freeView').classList.toggle('hidden',tab!=='free');
 document.getElementById('teacherPanel').classList.toggle('hidden',tab!=='swap');
 document.getElementById('swapPanel').classList.add('hidden');
 document.getElementById('tabSwap').classList.toggle('active',tab==='swap');
 document.getElementById('tabFree').classList.toggle('active',tab==='free');
}
function teacherBusy(t,d,p){return DATA.some(x=>x.d===d&&x.p===p&&(x.t===t||x.co===t));}
function filterTeachers(){
 const q=surname.value.trim();
 chips.innerHTML=q?TEACHERS.filter(t=>t.startsWith(q)).map(t=>`<button class="chip" onclick='chooseTeacher(${JSON.stringify(t)})'>${esc(t)}</button>`).join(''):'';
}
function recordsForTeacher(t,d,p){return DATA.filter(x=>x.d===d&&x.p===p&&(x.t===t||x.co===t));}
function renderTeacher(t){
 let out='<table class="tt"><thead><tr><th class="period">節次</th>'+DAYN.map(x=>`<th>星期${x}</th>`).join('')+'</tr></thead><tbody>';
 for(let p=1;p<=8;p++){out+=`<tr><td class="period">第${p}節</td>`;
  for(let d=1;d<=5;d++){const arr=recordsForTeacher(t,d,p); let cls='cell', click='';
    if(arr.length){
      const safe=(p<=7 && arr.length===1 && !arr[0].complex);
      cls += safe?' pickable':' blocked';
      if(safe) click=`onclick="pickCell(${d},${p})"`;
    }
    const body=arr.map(x=>`<div class="subject">${esc(x.s)}</div><div class="meta">${esc(x.c)}${x.w&&x.w!=='無'?'｜'+esc(x.w):''}</div>${x.complex?`<div class="meta">⚠ ${esc(x.reasons)}</div>`:''}`).join('<hr style="border:0;border-top:1px dashed #cbd5e1">');
    out+=`<td class="${cls}" ${click}>${body||'<span style="color:#94a3b8">—</span>'}</td>`;
  }out+='</tr>';
 }return out+'</tbody></table>';
}
function chooseTeacher(t){current=t;who.textContent=t+' 老師課表｜可點擊的格子才可進行調課';teacherTable.innerHTML=renderTeacher(t);swapPanel.classList.add('hidden');}

function capacityCount(subject,d,p,excludeClass=''){
 if(!(subject in CONTROLLED)) return null;
 const classes=new Set(DATA.filter(x=>x.d===d&&x.p===p&&x.s===subject&&x.c!==excludeClass).map(x=>x.c));
 return classes.size;
}
function capacityAfterMove(subject,d,p,cls){
 if(!(subject in CONTROLLED)) return null;
 return capacityCount(subject,d,p,cls)+1;
}
function capInfo(subject,d,p,cls){
 if(!(subject in CONTROLLED))return null;
 const after=capacityAfterMove(subject,d,p,cls), max=CONTROLLED[subject];
 return {after,max,ok:after<=max,text:`${subject}移入後同時 ${after} 班／上限 ${max} 班`};
}
function sameClassSlotComplex(cls,d,p){const a=DATA.filter(x=>x.c===cls&&x.d===d&&x.p===p);return a.length!==1||a[0].complex;}

function pickCell(d,p){
 if(!current||p>7)return;
 const a=recordsForTeacher(current,d,p);
 if(a.length!==1||a[0].complex)return;
 origin=a[0];
 findSwaps();
}
function findSwaps(){
 const o=origin, candidates=[];
 // Same class, full-week, simple courses only; periods 1-7 only.
 DATA.filter(x=>x.c===o.c&&x.p>=1&&x.p<=7&&x.w==='無'&&!x.complex&&!(x.d===o.d&&x.p===o.p)).forEach(x=>{
   const other=x.t;
   if(!other||other===current)return;
   if(sameClassSlotComplex(x.c,x.d,x.p))return;
   // Both teachers must be completely free at the other's time.
   if(teacherBusy(other,o.d,o.p))return;
   if(teacherBusy(current,x.d,x.p))return;

   // Venue/capacity checks in both directions.
   const c1=capInfo(o.s,x.d,x.p,o.c);
   const c2=capInfo(x.s,o.d,o.p,o.c);
   if((c1&&!c1.ok)||(c2&&!c2.ok))return;

   candidates.push({x,c1,c2});
 });

 swapTitle.textContent=`${current}｜${o.c} ${o.s}｜星期${DAYN[o.d-1]}第${o.p}節`;
 const candidateKeys=new Set(candidates.map(z=>z.x.d+'-'+z.x.p));
 map.innerHTML='<h3>班級調課地圖</h3>'+renderClassMap(o.c,o.d,o.p,candidateKeys);
 if(!candidates.length){
   results.innerHTML='<div class="warn"><b>沒有安全可調的候選。</b><br>可能原因：教師衝堂、單雙週／協同／跨班連動課務，或專科教室同時使用數已達上限。</div>';
 }else{
   results.innerHTML='<div class="ok">共找到 <b>'+candidates.length+'</b> 個通過安全檢查的候選時段。</div>'+
   candidates.map(z=>{
     const x=z.x;
     let caps=[z.c1,z.c2].filter(Boolean).map(c=>`<div class="capacity">🏫 ${esc(c.text)}</div>`).join('');
     return `<div class="result"><b>${esc(x.t)}</b>｜星期${DAYN[x.d-1]}第${x.p}節｜${esc(x.c)} ${esc(x.s)}${caps}</div>`;
   }).join('');
 }
 swapPanel.classList.remove('hidden');swapPanel.scrollIntoView({behavior:'smooth',block:'start'});
}
function renderClassMap(cls,od,op,cands){
 let out='<table class="tt"><thead><tr><th class="period">節次</th>'+DAYN.map(x=>`<th>星期${x}</th>`).join('')+'</tr></thead><tbody>';
 for(let p=1;p<=8;p++){out+=`<tr><td class="period">第${p}節</td>`;
  for(let d=1;d<=5;d++){let arr=DATA.filter(x=>x.c===cls&&x.d===d&&x.p===p);let key=d+'-'+p,cl='cell';
    if(d===od&&p===op)cl+=' selected';else if(cands.has(key))cl+=' candidate';
    const body=arr.map(x=>`<div class="subject">${esc(x.s)}</div><div class="meta">${esc(x.t)}${x.w&&x.w!=='無'?'｜'+esc(x.w):''}</div>`).join('<hr style="border:0;border-top:1px dashed #cbd5e1">');
    out+=`<td class="${cl}">${body||'—'}</td>`;
  }out+='</tr>';
 }return out+'</tbody></table>';
}

function showFree(){
 const d=+freeDay.value,p=+freePeriod.value;
 // Conservative: anyone with any primary/co-teacher assignment at the slot is treated as busy.
 const free=TEACHERS.filter(t=>!teacherBusy(t,d,p));
 freeResult.innerHTML=`<h3>星期${DAYN[d-1]}第${p}節：空堂老師 ${free.length} 位</h3>
 <p class="note">此處只依排課資料判斷「沒有課」。行政會議、差勤、巡堂、公假等未必記錄在課表中，實際代課前仍需確認。</p>
 <div class="freegrid">${free.map(t=>`<div class="free">${esc(t)}</div>`).join('')}</div>`;
}
