function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
const dayNames=["一", "二", "三", "四", "五"];
function cellItems(filterFn,d,p){return DATA.filter(x=>filterFn(x)&&+x.d===d&&+x.p===p);}
function renderTable(filterFn, opts={}){
 const showTeacher=opts.showTeacher??true, clickable=opts.clickable??false, marks=opts.marks||{};
 let out='<table class="tt"><thead><tr><th class="period">節次</th>'+dayNames.map(x=>`<th>星期${x}</th>`).join('')+'</tr></thead><tbody>';
 for(let p=1;p<=8;p++){ out+=`<tr><td class="period">第${p}節</td>`;
  for(let d=1;d<=5;d++){let items=cellItems(filterFn,d,p); let key=d+'-'+p; let cls=marks[key]||'';
   let content=items.map(x=>{let parts=[`<div class="subject">${esc(x.s)}</div>`]; if(x.c)parts.push(`<div class="meta">${esc(x.c)}</div>`); if(showTeacher && x.t){ parts.push(`<div class="meta">${esc(x.t)}</div>`); } if(x.w&&x.w!=='無')parts.push(`<span class="badge">${esc(x.w)}</span>`); return parts.join('')}).join('<hr style="border:0;border-top:1px dashed #cbd5e1">');
   out+=`<td class="cell ${cls}${clickable&&items.length?' clickable':''}" ${clickable&&items.length?`onclick="pickCell(${d},${p})"`:''}>${content||'<span class="empty">—</span>'}</td>`;
  } out+='</tr>';
 } return out+'</tbody></table>';
}

const teachers=[...new Set(DATA.flatMap(x=>[x.t,x.co]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
let current='', picked=null;
function filterTeachers(){let q=surname.value.trim();chips.innerHTML=q?teachers.filter(t=>t.startsWith(q)).map(t=>`<button class="chip" onclick="chooseTeacher('${t.replaceAll("'","\\'")}')">${esc(t)}</button>`).join(''):'';}
function chooseTeacher(t){current=t;who.textContent=t+' 老師課表｜點選想調的課';teacherTable.innerHTML=renderTable(x=>x.t===t||x.co===t,{clickable:true});swapPanel.style.display='none';}
function busy(t,d,p){return DATA.some(x=>+x.d===d&&+x.p===p&&(x.t===t||x.co===t));}
function pickCell(d,p){if(!current||p===8)return; let own=DATA.filter(x=>+x.d===d&&+x.p===p&&(x.t===current||x.co===current)); if(!own.length)return; picked={d,p,own}; findSwaps();}
function findSwaps(){
 let primary=picked.own[0], cls=primary.c, d0=picked.d,p0=picked.p;
 let candidates=[];
 DATA.filter(x=>x.c===cls&&+x.p>=1&&+x.p<=7&&!(+x.d===d0&&+x.p===p0)).forEach(x=>{
   let other=x.t; if(!other||other===current)return;
   if(!busy(other,d0,p0)&&!busy(current,+x.d,+x.p)){
     let key=[other,x.d,x.p,x.s,x.w].join('|'); if(!candidates.some(z=>z.key===key)) candidates.push({key,other,d:+x.d,p:+x.p,s:x.s,w:x.w,c:x.c});
   }
 });
 let marks={[d0+'-'+p0]:'selected'}; candidates.forEach(z=>marks[z.d+'-'+z.p]='candidate');
 swapTitle.textContent=`${current}｜${cls} ${primary.s}：星期${dayNames[d0-1]}第${p0}節`;
 map.innerHTML='<h3>調課地圖</h3>'+renderTable(x=>x.c===cls,{showTeacher:true,marks});
 results.innerHTML=candidates.length?candidates.map(z=>`<div class="result"><b>${esc(z.other)}</b>｜可與 星期${dayNames[z.d-1]}第${z.p}節「${esc(z.s)}」互換 ${z.w&&z.w!=='無'?`<span class="badge">${esc(z.w)}</span>`:''}</div>`).join(''):'<p>目前沒有找到符合雙方都不衝堂的互換時段。</p>';
 swapPanel.style.display='block'; swapPanel.scrollIntoView({behavior:'smooth',block:'start'});
}
